# Redraws the contribution graph as a snake once a day and pushes the result to the "output" branch.
# Blue snake for light mode, muted red for dark mode.
name: Snake

on:
  schedule: [{ cron: "0 0 * * *" }]   # once a day, midnight UTC
  workflow_dispatch:                  # and whenever you press Run workflow

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: nekumonokat
          outputs: |
            dist/github-snake.svg?color_snake=#1f6feb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff7b72

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
